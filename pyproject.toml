[project]
name = "card-counting-llm"
version = "0.1.0"
description = "Learn how transformers work by training one to count cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.2",
    "torch>=2.8.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.3.5",
    "ruff>=0.12.4",
]
notebook = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.0",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackjack"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["notebooks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
