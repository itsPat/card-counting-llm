[project]
name = "card-counting-llm"
version = "0.1.0"
description = "Learn how transformers work by training one to count cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.2",
    "torch>=2.8.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
notebook = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackjack"]
